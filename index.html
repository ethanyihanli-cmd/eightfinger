<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eight Finger Challenge</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #070b12;
      color: #f8fafc;
      font-family: Verdana, Arial, sans-serif;
      display: grid;
      place-items: center;
    }

    .game {
      width: min(1120px, 100vw);
      height: min(720px, 100vh);
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(142, 202, 230, 0.28), transparent 24%),
        radial-gradient(circle at 84% 14%, rgba(255, 209, 102, 0.2), transparent 24%),
        linear-gradient(#08111f, #101c33 52%, #05070d);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .menu,
    .game-over {
      position: absolute;
      inset: 54px 72px;
      background: rgba(10, 15, 26, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 48px 56px;
    }

    .menu h1,
    .game-over h1 {
      margin: 0 0 16px;
      color: #8ecae6;
      font-size: 42px;
      letter-spacing: 0;
    }

    .menu p,
    .game-over p {
      color: rgba(255, 255, 255, 0.78);
      margin: 0 0 24px;
      line-height: 1.5;
    }

    .rows {
      width: min(440px, 100%);
      display: grid;
      gap: 10px;
    }

    .row {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 14px 18px;
    }

    .row.selected {
      border-color: rgba(255, 209, 102, 0.84);
      background: rgba(142, 202, 230, 0.16);
    }

    .label {
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 700;
    }

    .value {
      margin-top: 4px;
      font-size: 28px;
      font-weight: 700;
    }

    .detail {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
    }

    .side {
      position: absolute;
      right: 96px;
      top: 210px;
      width: 310px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 780px) {
      .game {
        height: 100vh;
      }

      .menu,
      .game-over {
        inset: 18px;
        padding: 28px 22px;
      }

      .menu h1,
      .game-over h1 {
        font-size: 30px;
      }

      .side {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <canvas id="canvas" width="1120" height="720"></canvas>

    <section id="menu" class="menu">
      <h1>THE 8 FINGER CHALLENGE</h1>
      <p>Use UP/DOWN to move, LEFT/RIGHT to change, ENTER to start.</p>
      <div class="rows" id="menuRows"></div>
      <div class="side">A keyboard rhythm game inspired by phone rhythm games, but made meaner. Start low, then work up to all 8 fingers.</div>
    </section>

    <section id="gameOver" class="game-over hidden">
      <h1>RUN OVER</h1>
      <p id="finalScore"></p>
      <p>Press R to replay or ENTER for menu.</p>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const menu = document.getElementById("menu");
    const gameOver = document.getElementById("gameOver");
    const menuRows = document.getElementById("menuRows");
    const finalScore = document.getElementById("finalScore");

    const laneSets = [
      ["J"],
      ["F", "J"],
      ["D", "F", "J", "K"],
      ["S", "D", "F", "J", "K", "L"],
      ["A", "S", "D", "F", "H", "J", "K", "L"]
    ];

    const songs = [
      { title: "Just the Two of Us", bpm: 96, color: "#8ecae6" },
      { title: "Shadow of the Sun", bpm: 108, color: "#d9ed92" },
      { title: "Flowers", bpm: 118, color: "#ffcad4" }
    ];

    const modes = [
      { label: "Practice", misses: Infinity },
      { label: "Normal", misses: 10 }
    ];

    let state = "menu";
    let selectedSong = 0;
    let selectedDifficulty = 2;
    let selectedMode = 1;
    let selectedRow = 0;
    let notes = [];
    let chart = [];
    let nextNote = 0;
    let songTime = 0;
    let lastTime = 0;
    let score = 0;
    let combo = 0;
    let misses = 0;
    let feedback = "";
    let feedbackTime = 0;
    let pressed = new Set();

    function makeChart() {
      const base = [0, 1, 2, 1, 3, 2, 1, 0, 0, 2, 1, 3, 2, 1, 0, 1];
      const result = [];
      const level = selectedDifficulty + 1;
      const spacing = level >= 4 ? 0.5 : level >= 3 ? 0.75 : 1;
      for (let loop = 0; loop < 8; loop++) {
        for (let i = 0; i < base.length; i++) {
          if (level === 1 && i % 4 !== 0) continue;
          if (level === 2 && i % 2 !== 0) continue;
          result.push({
            beat: loop * 16 + i * spacing,
            lane: (base[i] + loop) % laneSets[selectedDifficulty].length,
            hold: i % 11 === 5 ? 1.5 : 0
          });
          if (level >= 5 && i % 6 === 0) {
            result.push({
              beat: loop * 16 + i * spacing,
              lane: (base[i] + loop + 2) % laneSets[selectedDifficulty].length,
              hold: 0
            });
          }
        }
      }
      return result.sort((a, b) => a.beat - b.beat);
    }

    function renderMenu() {
      const lanes = laneSets[selectedDifficulty].join(" ");
      const rows = [
        ["TRACK", songs[selectedSong].title, `${songs[selectedSong].bpm} bpm`],
        ["DIFFICULTY", String(selectedDifficulty + 1), `keys ${lanes}`],
        ["MODE", modes[selectedMode].label, modes[selectedMode].misses === Infinity ? "unlimited misses" : "10 misses max"],
        ["START", "Play", "press ENTER to launch this chart"]
      ];
      menuRows.innerHTML = rows.map((row, index) => `
        <div class="row ${index === selectedRow ? "selected" : ""}">
          <div class="label">${row[0]}</div>
          <div class="value">${row[1]}</div>
          <div class="detail">${row[2]}</div>
        </div>
      `).join("");
    }

    function startGame() {
      state = "playing";
      menu.classList.add("hidden");
      gameOver.classList.add("hidden");
      chart = makeChart();
      notes = [];
      nextNote = 0;
      songTime = 0;
      score = 0;
      combo = 0;
      misses = 0;
      feedback = "START";
      feedbackTime = 0.7;
    }

    function finishGame(text) {
      state = "over";
      feedback = text;
      feedbackTime = 0.7;
      finalScore.textContent = `score ${score}    combo ${combo}    misses ${misses}`;
      gameOver.classList.remove("hidden");
    }

    function update(delta) {
      if (state !== "playing") return;
      songTime += delta;
      feedbackTime = Math.max(0, feedbackTime - delta);
      const speed = 165 + selectedDifficulty * 48;
      const travelTime = 623 / speed;
      const secondsPerBeat = 60 / songs[selectedSong].bpm;

      while (nextNote < chart.length && chart[nextNote].beat * secondsPerBeat - travelTime <= songTime) {
        const item = chart[nextNote++];
        notes.push({
          y: -26,
          lane: item.lane,
          key: laneSets[selectedDifficulty][item.lane],
          hold: item.hold,
          height: item.hold ? 26 + item.hold * secondsPerBeat * speed : 26,
          active: false
        });
      }

      for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        note.y += speed * delta;
        if (note.active && !pressed.has(note.key)) {
          notes.splice(i, 1);
          miss("EARLY");
          continue;
        }
        if (note.active && note.y + note.height >= 610) {
          notes.splice(i, 1);
          hit("HOLD", 18);
          continue;
        }
        if (!note.active && note.y + 13 > 652) {
          notes.splice(i, 1);
          miss("MISS");
        }
      }

      if (nextNote >= chart.length && notes.length === 0) {
        finishGame("CLEAR");
      }
    }

    function laneX(index) {
      const count = laneSets[selectedDifficulty].length;
      const total = count * 60 + (count - 1) * 12;
      return (1120 - total) / 2 + index * 72;
    }

    function hit(label, points) {
      score += points + Math.floor(combo / 4);
      combo++;
      feedback = label;
      feedbackTime = 0.7;
    }

    function miss(label) {
      combo = 0;
      misses++;
      feedback = label;
      feedbackTime = 0.7;
      if (misses >= modes[selectedMode].misses) {
        finishGame("GAME OVER");
      }
    }

    function pressKey(key) {
      if (!laneSets[selectedDifficulty].includes(key)) return;
      let best = null;
      let bestDistance = 49;
      for (const note of notes) {
        if (note.key !== key || note.active) continue;
        const distance = Math.abs(note.y + 13 - 610);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = note;
        }
      }
      if (!best) {
        miss("MISS");
        return;
      }
      const label = bestDistance <= 9 ? "PERFECT" : bestDistance <= 18 ? "EXCELLENT" : bestDistance <= 30 ? "GREAT" : "GOOD";
      const points = bestDistance <= 9 ? 36 : bestDistance <= 18 ? 30 : bestDistance <= 30 ? 24 : 16;
      hit(label, points);
      if (best.hold) {
        best.active = true;
      } else {
        notes.splice(notes.indexOf(best), 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, 1120, 720);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(84, 620, 952, 2);
      const keys = laneSets[selectedDifficulty];

      for (let i = 0; i < keys.length; i++) {
        const x = laneX(i);
        ctx.fillStyle = `hsla(${(i * 42 + 350) % 360}, 85%, 62%, 0.26)`;
        ctx.fillRect(x, 34, 60, 652);
        ctx.fillStyle = "#fff";
        ctx.font = "700 18px Verdana";
        ctx.textAlign = "center";
        ctx.fillText(keys[i], x + 30, 592);
      }

      ctx.strokeStyle = songs[selectedSong].color;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(84, 610);
      ctx.lineTo(1036, 610);
      ctx.stroke();
      ctx.lineWidth = 1;

      for (const note of notes) {
        const x = laneX(note.lane);
        ctx.fillStyle = `hsla(${(note.lane * 42 + 350) % 360}, 85%, 62%, ${note.active ? 0.9 : 0.72})`;
        if (note.hold) {
          ctx.fillRect(x + 18, note.y + 26, 24, note.height - 26);
        }
        ctx.fillRect(x, note.y, 60, 26);
      }

      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(5,8,14,0.78)";
      ctx.fillRect(24, 24, 260, 176);
      ctx.fillStyle = songs[selectedSong].color;
      ctx.font = "700 14px Verdana";
      ctx.fillText(songs[selectedSong].title.toUpperCase(), 42, 50);
      ctx.fillStyle = "#fff";
      ctx.font = "700 28px Verdana";
      ctx.fillText(String(score), 42, 86);
      ctx.font = "16px Verdana";
      ctx.fillText(`combo  ${combo}`, 42, 116);
      ctx.fillText(`mode  ${modes[selectedMode].label}`, 42, 140);
      ctx.fillText(`miss  ${misses}/${modes[selectedMode].misses === Infinity ? "INF" : modes[selectedMode].misses}`, 42, 164);

      if (feedbackTime > 0) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffd166";
        ctx.font = "700 34px Verdana";
        ctx.fillText(feedback, 560, 100);
      }
    }

    function loop(now) {
      const delta = lastTime ? (now - lastTime) / 1000 : 0;
      lastTime = now;
      update(Math.min(delta, 0.04));
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toUpperCase();
      pressed.add(key);
      if (state === "menu") {
        if (event.key === "ArrowUp") selectedRow = (selectedRow + 3) % 4;
        if (event.key === "ArrowDown") selectedRow = (selectedRow + 1) % 4;
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          const direction = event.key === "ArrowRight" ? 1 : -1;
          if (selectedRow === 0) selectedSong = (selectedSong + direction + songs.length) % songs.length;
          if (selectedRow === 1) selectedDifficulty = Math.max(0, Math.min(4, selectedDifficulty + direction));
          if (selectedRow === 2) selectedMode = (selectedMode + direction + modes.length) % modes.length;
          if (selectedRow === 3 && direction > 0) startGame();
        }
        if (event.key === "Enter") {
          if (selectedRow === 3) startGame();
          else selectedRow = (selectedRow + 1) % 4;
        }
        renderMenu();
      } else if (state === "playing") {
        if (key === "R") startGame();
        else if (event.key === "Enter" || event.key === "Escape") {
          state = "menu";
          menu.classList.remove("hidden");
          gameOver.classList.add("hidden");
          renderMenu();
        } else {
          pressKey(key);
        }
      } else if (state === "over") {
        if (key === "R") startGame();
        if (event.key === "Enter" || event.key === "Escape") {
          state = "menu";
          menu.classList.remove("hidden");
          gameOver.classList.add("hidden");
          renderMenu();
        }
      }
    });

    document.addEventListener("keyup", event => {
      pressed.delete(event.key.toUpperCase());
    });

    renderMenu();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
